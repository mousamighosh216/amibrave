services:
  - type: web
    name: amibrave-backend
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 90 --bind 0.0.0.0:$PORT

    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://mousamighosh216.github.io"
      - key: PYTHON_VERSION
        value: "3.14.3"

    healthCheckPath: /health
