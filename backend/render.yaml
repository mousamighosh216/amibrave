version: "1"
projects:
- name: My project
  environments:
  - name: Production
    services:
    - type: web
      name: amibrave
      runtime: python
      repo: https://github.com/mousamighosh216/amibrave
      plan: free
      envVars:
      - key: FLASK_ENV
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      region: virginia
      buildCommand: pip install -r requirements.txt
      startCommand: gunicorn app:app --workers 2 --timeout 90 --bind 0.0.0.0:$PORT
      autoDeployTrigger: commit
      rootDir: backend/
